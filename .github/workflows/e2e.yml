name: E2E Tests (Preview)

on:
  push:
    branches: [demo]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 3

      - name: Install Playwright
        run: npx playwright install chromium
        timeout-minutes: 2

      - name: Wait for Vercel deploy
        run: sleep 120

      - name: Get Vercel preview URL
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          URL=$(vercel ls --token "$VERCEL_TOKEN" --format json 2>/dev/null | node -p "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));const r=(d.deployments||[]).sort((a,b)=>b.createdAt-a.createdAt).find(x=>x.state==='READY');r?r.url:''}catch(e){''}")
          echo "URL=$URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        run: npx playwright test --reporter=list --timeout=60000
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.vercel.outputs.url }}
        timeout-minutes: 7

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
