name: E2E Tests (Preview)

on:
  push:
    branches: [demo]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Wait for Vercel deploy and get URL
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            DEPLOY_JSON=$(curl -sf "https://api.vercel.com/v6/deployments?teamId=team_xv4KlhF2T3EKAQxIQj4veQ4G&limit=3" \
              -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null)
            URL=$(echo "$DEPLOY_JSON" | node -p "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));const r=(d.deployments||[]).find(x=>x.state==='READY');r?r.url:''}catch(e){''}")
            if [ -n "$URL" ]; then
              echo "url=$URL" >> $GITHUB_OUTPUT
              echo "Deployment URL: $URL"
              break
            fi
            sleep 5
          done

      - name: Run E2E tests against preview
        run: npx playwright test --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.vercel.outputs.url }}
          E2E_TEST_EMAIL: demo@gotakecrm.com
          E2E_TEST_PASSWORD: demo2026

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
