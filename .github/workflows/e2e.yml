name: E2E Tests (Preview)

on:
  push:
    branches: [demo]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Wait for Vercel deployment and get URL
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            OUTPUT=$(vercel ls --token "$VERCEL_TOKEN" --scope feellipes-projects --format json 2>/dev/null)
            URL=$(echo "$OUTPUT" | node -p "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));const deps=(d.deployments||[]).sort((a,b)=>b.createdAt-a.createdAt);const r=deps.find(d=>d.state==='READY'||d.state==='ERROR');r?r.url+'|'+r.state:''}catch(e){''}" 2>/dev/null)
            if [ -n "$URL" ]; then
              URL_PART=$(echo "$URL" | cut -d'|' -f1)
              echo "url=$URL_PART" >> $GITHUB_OUTPUT
              echo "Deployment found: $URL_PART"
              break
            fi
            echo "Waiting... (attempt $i/60)"
            sleep 5
          done

      - name: Run E2E tests against preview
        run: npx playwright test --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.vercel.outputs.url }}
          E2E_TEST_EMAIL: demo@gotakecrm.com
          E2E_TEST_PASSWORD: demo2026

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
