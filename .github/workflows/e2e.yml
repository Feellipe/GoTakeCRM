name: E2E Tests (Preview)

on:
  push:
    branches: [demo]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Get latest Vercel preview URL
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          sleep 60
          URL=$(vercel ls --token "$VERCEL_TOKEN" --scope feellipes-projects --format json 2>/dev/null | node -p "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));const deps=(d.deployments||[]).sort((a,b)=>b.createdAt-a.createdAt);const r=deps.find(d=>d.state==='READY');r?r.url:''}catch(e){''}")
          echo "Preview URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Wait for app to be responsive
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://${{ steps.vercel.outputs.url }}/login" > /dev/null 2>&1; then
              echo "App is ready!"
              break
            fi
            echo "Waiting for app... (attempt $i/30)"
            sleep 5
          done

      - name: Run E2E tests against preview
        run: npx playwright test --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.vercel.outputs.url }}
          E2E_TEST_EMAIL: demo@gotakecrm.com
          E2E_TEST_PASSWORD: demo2026

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
